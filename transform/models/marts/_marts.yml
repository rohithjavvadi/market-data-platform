version: 2

models:
  - name: fct_ohlcv_1m
    description: One-minute OHLCV bars per symbol, built from deduplicated trades.
    columns:
      - name: bar_key
        description: symbol|minute; unique per bar.
        data_tests:
          - unique
          - not_null
      - name: bar_ts_utc
        data_tests:
          - not_null
      - name: trade_count
        data_tests:
          - not_null

  - name: dim_date
    description: Calendar 2021-2030; is_market_day from Tiingo trading days.
    columns:
      - name: date_day
        data_tests:
          - unique
          - not_null
      - name: date_key
        data_tests:
          - unique
          - not_null

  - name: dim_security
    description: SCD2 security dimension from SEC submissions (dbt snapshot on stg_edgar_companies).
    columns:
      - name: security_sk
        data_tests:
          - unique
          - not_null
      - name: ticker
        data_tests:
          - not_null
