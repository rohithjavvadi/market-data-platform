version: 2

models:
  - name: stg_trades
    description: Typed trades, deduplicated on Kafka partition and offset (bronze is at-least-once).
    columns:
      - name: trade_key
        description: Kafka partition-offset; unique per message.
        data_tests:
          - unique
          - not_null
      - name: symbol
        data_tests:
          - not_null
      - name: price
        data_tests:
          - not_null
      - name: trade_ts_utc
        data_tests:
          - not_null
      - name: exchange
        data_tests:
          - accepted_values:
              arguments:
                values: ["SIM", "FINNHUB"]
