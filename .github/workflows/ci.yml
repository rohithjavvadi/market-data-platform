name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: ruff lint
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: sqlfluff
        working-directory: transform
        run: sqlfluff lint models

  test:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: pytest
        run: pytest tests -q

  dbt:
    if: github.event_name == 'pull_request'
    needs: lint
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/transform/ci
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/dbt_key.p8
      DBT_CI_SCHEMA: PR_${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dbt.txt
      - run: pip install -r requirements-dbt.txt
      - name: Write key
        env:
          KEY: ${{ secrets.SNOWFLAKE_DBT_PRIVATE_KEY }}
        run: printf '%s\n' "$KEY" > /tmp/dbt_key.p8 && chmod 600 /tmp/dbt_key.p8
      - name: Baseline manifest from base branch
        run: |
          git worktree add /tmp/base origin/${{ github.base_ref }}
          cd /tmp/base/transform
          dbt deps
          dbt parse --target prod
      - name: dbt build (modified + downstream, deferred to PROD)
        working-directory: transform
        run: |
          dbt deps
          dbt build --target ci --select state:modified+ --exclude resource_type:snapshot --defer --state /tmp/base/transform/target

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
