name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dbt-prod:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/transform/ci
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/dbt_key.p8
    defaults:
      run:
        working-directory: transform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dbt.txt
      - run: pip install -r ../requirements-dbt.txt
      - name: Write key
        env:
          KEY: ${{ secrets.SNOWFLAKE_DBT_PRIVATE_KEY }}
        run: printf '%s\n' "$KEY" > /tmp/dbt_key.p8 && chmod 600 /tmp/dbt_key.p8
      - run: dbt deps
      - name: dbt build (prod)
        run: dbt build --target prod
      - name: Upload prod manifest
        uses: actions/upload-artifact@v4
        with:
          name: prod-manifest
          path: transform/target/manifest.json
          retention-days: 30
      - name: dbt docs (static site)
        run: |
          dbt docs generate --target prod --static
          mkdir -p ../site && cp target/static_index.html ../site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  docs-pages:
    needs: dbt-prod
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
